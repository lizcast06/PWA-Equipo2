name: Academic Evaluation · Semana 08

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Suites heredadas (semanas 1–6)
        run: npm run test:legacy
      - name: Unit + integración con cobertura
        run: npm run test:coverage
      - name: Instalar navegador E2E
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright contra next start)
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
      - name: Reportes y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-w08-${{ github.sha }}
          if-no-files-found: warn
          path: |
            coverage/
            test-results/
            playwright-report/